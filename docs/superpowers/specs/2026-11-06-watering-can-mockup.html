<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watering Can mockup</title>
<style>body{font-family:system-ui,sans-serif;background:#f6f1e4;color:#111;max-width:760px;margin:24px auto;padding:0 16px}.split{display:flex;gap:16px}.mockup{flex:1;border:1px solid #ccc;background:#fff}.mockup-header{padding:6px 10px;font-size:13px;border-bottom:1px solid #ccc}.subtitle{color:#555}</style></head><body>
<!-- Approved mockup for docs/superpowers/specs/2026-11-06-watering-can-design.md. The DENSE panel is the chosen density. -->
<h2>Watering Can: the plants reveal the person</h2>
<p class="subtitle">Option B (the whole plant ripens together). There's no outline and no fill. The person is only visible through what grows. Stems stay inside the body, while leaves and flowers can hang a little past the edge.</p>

<div style="display:flex;gap:12px;align-items:center;margin:8px 0 16px">
  <button class="mock-button" id="play">Play growth</button>
  <button class="mock-button" id="rewind">Rewind</button>
  <label style="flex:1">Growth <input id="g" type="range" min="0" max="1000" value="700" style="width:70%"></label>
</div>

<div class="split">
  <div class="mockup">
    <div class="mockup-header">Sparse: about 16 vines</div>
    <div class="mockup-body"><canvas id="A" width="300" height="420" style="width:100%;display:block"></canvas></div>
  </div>
  <div class="mockup">
    <div class="mockup-header">Dense: about 30 vines</div>
    <div class="mockup-body"><canvas id="B" width="300" height="420" style="width:100%;display:block"></canvas></div>
  </div>
</div>

<script>
(function(){
  const W=300,H=420, INK='#111', PAPER='#f6f1e4';
  const mask=document.createElement('canvas'); mask.width=W; mask.height=H;
  const m=mask.getContext('2d');
  m.strokeStyle=m.fillStyle='#fff'; m.lineCap='round';
  m.beginPath(); m.arc(150,70,26,0,7); m.fill();
  const seg=(x0,y0,x1,y1,w)=>{m.lineWidth=w;m.beginPath();m.moveTo(x0,y0);m.lineTo(x1,y1);m.stroke();};
  seg(150,104,150,225,62); seg(124,118,96,238,22); seg(176,118,204,238,22);
  seg(139,228,130,394,26); seg(161,228,170,394,26); seg(150,92,150,104,20);
  const md=m.getImageData(0,0,W,H).data;
  const inside=(x,y)=>{x|=0;y|=0;return x>=0&&x<W&&y>=0&&y<H&&md[(y*W+x)*4+3]>128;};
  function makeVines(step){
    const vs=[]; let i=0;
    for(let x=84;x<=216;x+=step){
      let lo=-1,hi=-1;
      for(let y=H-1;y>=0;y--) if(inside(x,y)){ if(lo<0)lo=y; hi=y; }
      if(lo>0) vs.push({x,lo,hi,ph:(i*2.399)%6.28,fl:['#e8957f','#e8862f','#6b5b95','#bc4c26','#d85f8a'][i++%5]});
    }
    return vs;
  }
  const sets={A:makeVines(8.5),B:makeVines(4.5)};
  const hsl=(h,s,l)=>`hsl(${h},${(s*100).toFixed(0)}%,${l}%)`;
  function draw(id,g){
    const c=document.getElementById(id).getContext('2d');
    c.fillStyle=PAPER; c.fillRect(0,0,W,H);
    c.strokeStyle=INK; c.lineWidth=2; c.beginPath(); c.moveTo(10,396); c.lineTo(290,396); c.stroke();
    const sat=0.1+0.85*Math.min(1,g*1.1);
    c.lineCap='round';
    const flowers=[];
    for(const v of sets[id]){
      const span=v.lo-v.hi, tip=g*span;
      const xs=t=>v.x+Math.sin(t*0.06+v.ph)*5;
      c.strokeStyle=hsl(105,sat,28); c.lineWidth=2.2;
      for(let t=0;t<tip;t+=3){ if(!inside(xs(t),v.lo-t)) continue;
        c.beginPath(); c.moveTo(xs(t),v.lo-t); c.lineTo(xs(t+3),v.lo-t-3); c.stroke(); }
      for(let t=12;t<tip-6;t+=18){
        const x=xs(t), y=v.lo-t; if(!inside(x,y)) continue;
        const side=((t/18)|0)%2?1:-1;
        c.save(); c.translate(x,y); c.rotate(side*0.8+Math.sin(v.ph+t)*0.3); c.beginPath(); c.ellipse(side*8,0,9,3.8,0,0,7);
        c.fillStyle=hsl(110,sat,44); c.fill(); c.strokeStyle=INK; c.lineWidth=1.1; c.stroke(); c.restore();
      }
      const tf=tip/span, x=xs(tip), y=v.lo-tip;
      if(tip>4 && inside(x,y)) flowers.push({x,y,tf,v});
    }
    for(const f of flowers){
      c.strokeStyle=INK; c.lineWidth=1.1;
      if(f.tf>0.6){
        const open=Math.min(1,(f.tf-0.6)/0.3), r=2.5+5.5*open;
        c.filter=`saturate(${Math.min(1,g*1.1)})`;
        for(let k=0;k<5;k++){const a=k*1.2566+f.v.ph; c.beginPath(); c.arc(f.x+Math.cos(a)*r,f.y+Math.sin(a)*r,r*0.8,0,7);
          c.fillStyle=f.v.fl; c.fill(); c.stroke();}
        c.beginPath(); c.arc(f.x,f.y,r*0.45,0,7); c.fillStyle='#fff200'; c.fill(); c.stroke();
        c.filter='none';
      } else { c.fillStyle=hsl(110,sat,44); c.beginPath(); c.arc(f.x,f.y,2.5,0,7); c.fill(); c.stroke(); }
    }
  }
  const s=document.getElementById('g');
  const render=()=>{const g=s.value/1000; draw('A',g); draw('B',g);};
  s.oninput=render; render();
  let anim=null;
  function run(dir){ if(anim)cancelAnimationFrame(anim);
    if(dir>0&&+s.value>=1000) s.value=0;
    const step=()=>{ let v=Math.max(0,Math.min(1000,+s.value+dir*6)); s.value=v; render();
      if(v>0&&v<1000) anim=requestAnimationFrame(step); };
    anim=requestAnimationFrame(step); }
  document.getElementById('play').onclick=()=>run(1);
  document.getElementById('rewind').onclick=()=>run(-1);
})();
</script>

</body></html>
