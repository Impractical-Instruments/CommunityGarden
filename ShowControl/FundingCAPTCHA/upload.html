<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Send Your Photo</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0f;
  --surface: #14141e;
  --border: #2a2a3e;
  --accent: #7c3aed;
  --accent2: #06b6d4;
  --text: #e2e8f0;
  --muted: #64748b;
  --success: #22c55e;
  --danger: #ef4444;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 20px 16px 40px;
}

.card {
  width: 100%;
  max-width: 480px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px 24px;
}

h1 {
  font-size: 1.6rem;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
}
.subtitle { color: var(--muted); font-size: .95rem; margin-bottom: 28px; }

label {
  display: block;
  font-size: .8rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 6px;
}

input[type=text] {
  width: 100%;
  background: #1e1e2e;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 1.1rem;
  padding: 12px 16px;
  outline: none;
  margin-bottom: 20px;
}
input[type=text]:focus { border-color: var(--accent); }

/* Photo picker area */
.photo-area {
  border: 2px dashed var(--border);
  border-radius: 14px;
  padding: 24px 16px;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s;
  margin-bottom: 20px;
  position: relative;
}
.photo-area:hover { border-color: var(--accent); }
.photo-area.has-photo { border-style: solid; border-color: var(--accent2); padding: 0; overflow: hidden; }

.photo-area img {
  width: 100%;
  max-height: 300px;
  object-fit: contain;
  border-radius: 12px;
  display: block;
}

.photo-icon { font-size: 3rem; margin-bottom: 8px; }
.photo-hint { color: var(--muted); font-size: .9rem; }

input[type=file] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}

.btn-row {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
}

.btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: opacity .15s;
}
.btn:hover { opacity: .85; }
.btn:disabled { opacity: .4; cursor: default; }

.btn-camera  { background: var(--accent); color: #fff; }
.btn-gallery { background: #1e1e2e; border: 1px solid var(--border); color: var(--text); }
.btn-upload  {
  width: 100%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  font-size: 1.15rem;
  padding: 16px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  font-weight: 700;
  transition: opacity .15s;
}
.btn-upload:hover:not(:disabled) { opacity: .88; }
.btn-upload:disabled { opacity: .4; cursor: default; }

/* Status banner */
.status {
  margin-top: 16px;
  padding: 14px;
  border-radius: 10px;
  font-size: .95rem;
  text-align: center;
  display: none;
}
.status.success { background: #22c55e20; border: 1px solid var(--success); color: var(--success); display: block; }
.status.error   { background: #ef444420; border: 1px solid var(--danger);  color: var(--danger);  display: block; }
.status.loading { background: #7c3aed20; border: 1px solid var(--accent);  color: var(--accent);  display: block; }

/* Progress bar */
.progress-wrap { margin-top: 10px; background: #2a2a3e; border-radius: 4px; height: 6px; overflow: hidden; display: none; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .2s; border-radius: 4px; }

.sent-list { margin-top: 24px; }
.sent-list h3 { font-size: .85rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
.sent-thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.sent-thumb {
  width: 64px; height: 64px;
  border-radius: 8px;
  object-fit: cover;
  border: 2px solid var(--success);
}
</style>
</head>
<body>
<div class="card">
  <h1>📸 Send Your Photo</h1>
  <p class="subtitle">Take a photo of something and send it in to the game!</p>

  <label for="name-field">Your name</label>
  <input type="text" id="name-field" placeholder="e.g. Jamie" autocomplete="given-name">

  <label for="label-field">What's in the photo?</label>
  <input type="text" id="label-field" placeholder="e.g. my dog, a yellow bus, the big tree…">

  <!-- Camera capture button (shows native camera on mobile) -->
  <div class="btn-row">
    <button class="btn btn-camera" id="btn-take">📷 Take Photo</button>
    <button class="btn btn-gallery" id="btn-pick">🖼 From Gallery</button>
  </div>
  <!-- Hidden file inputs -->
  <input type="file" id="input-camera"  accept="image/*" capture="environment" style="display:none">
  <input type="file" id="input-gallery" accept="image/*" style="display:none">

  <!-- Preview area -->
  <div class="photo-area" id="preview-area">
    <div class="photo-icon">🌅</div>
    <div class="photo-hint">Tap a button above to choose your photo</div>
  </div>

  <button class="btn-upload" id="btn-upload" disabled>Send Photo ✈️</button>

  <div id="progress-wrap" class="progress-wrap"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <div id="status" class="status"></div>

  <div class="sent-list" id="sent-list" style="display:none">
    <h3>Sent this session</h3>
    <div class="sent-thumbs" id="sent-thumbs"></div>
  </div>
</div>

<script>
const nameField    = document.getElementById('name-field');
const labelField   = document.getElementById('label-field');
const previewArea  = document.getElementById('preview-area');
const btnUpload    = document.getElementById('btn-upload');
const statusEl     = document.getElementById('status');
const progressWrap = document.getElementById('progress-wrap');
const progressFill = document.getElementById('progress-fill');
const sentList     = document.getElementById('sent-list');
const sentThumbs   = document.getElementById('sent-thumbs');

let selectedDataUrl = null;

// Wire camera / gallery buttons to hidden inputs
document.getElementById('btn-take').addEventListener('click', () => document.getElementById('input-camera').click());
document.getElementById('btn-pick').addEventListener('click', () => document.getElementById('input-gallery').click());
document.getElementById('input-camera').addEventListener('change',  e => handleFile(e.target.files[0]));
document.getElementById('input-gallery').addEventListener('change', e => handleFile(e.target.files[0]));

function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    // Resize client-side to max 600px so uploads stay small
    resizeImage(e.target.result, 600, (dataUrl) => {
      selectedDataUrl = dataUrl;
      previewArea.innerHTML = `<img src="${dataUrl}" alt="preview">`;
      previewArea.classList.add('has-photo');
      btnUpload.disabled = false;
      clearStatus();
    });
  };
  reader.readAsDataURL(file);
}

function resizeImage(dataUrl, maxPx, cb) {
  const img = new Image();
  img.onload = () => {
    const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
    const w = Math.round(img.width  * scale);
    const h = Math.round(img.height * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    cb(canvas.toDataURL('image/jpeg', 0.82));
  };
  img.src = dataUrl;
}

btnUpload.addEventListener('click', async () => {
  if (!selectedDataUrl) return;
  const label = labelField.value.trim() || 'untitled';
  const name  = nameField.value.trim();

  btnUpload.disabled = true;
  showStatus('loading', 'Sending… ✈️');
  progressWrap.style.display = 'block';
  progressFill.style.width = '30%';

  try {
    progressFill.style.width = '60%';
    const res  = await fetch('/upload', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ label, name, data: selectedDataUrl }),
    });
    progressFill.style.width = '100%';
    const json = await res.json();

    if (json.ok) {
      showStatus('success', `✅ Got it! "${label}" is on its way into the game.`);
      addSentThumb(selectedDataUrl);
      // Reset form
      selectedDataUrl = null;
      labelField.value = '';
      previewArea.innerHTML = '<div class="photo-icon">🌅</div><div class="photo-hint">Tap a button above to choose your photo</div>';
      previewArea.classList.remove('has-photo');
      // Reset file inputs so same file can be reselected
      document.getElementById('input-camera').value  = '';
      document.getElementById('input-gallery').value = '';
    } else {
      throw new Error(json.error || 'Unknown error');
    }
  } catch (err) {
    showStatus('error', `❌ Something went wrong: ${err.message}`);
    btnUpload.disabled = false;
  } finally {
    setTimeout(() => { progressWrap.style.display = 'none'; progressFill.style.width = '0%'; }, 600);
  }
});

function showStatus(type, msg) {
  statusEl.className = `status ${type}`;
  statusEl.textContent = msg;
}
function clearStatus() {
  statusEl.className = 'status';
}

function addSentThumb(dataUrl) {
  sentList.style.display = 'block';
  const img = document.createElement('img');
  img.className = 'sent-thumb';
  img.src = dataUrl;
  sentThumbs.appendChild(img);
}
</script>
</body>
</html>
