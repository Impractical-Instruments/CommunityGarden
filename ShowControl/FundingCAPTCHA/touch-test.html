<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Touch Test — FundingCAPTCHA</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; padding: 24px; gap: 20px; }

  #controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 15px;
  }
  #controls label { color: var(--text-muted, #aaa); }
  #controls input[type=number] {
    width: 56px;
    padding: 6px 8px;
    font-size: 15px;
    background: var(--surface, #1e1e1e);
    color: var(--text, #eee);
    border: 1px solid var(--border, #444);
    border-radius: 6px;
    text-align: center;
  }
  #controls button {
    padding: 6px 18px;
    font-size: 15px;
  }

  #info {
    font-size: 13px;
    color: var(--text-muted, #888);
    text-align: center;
    line-height: 1.6;
  }

  #grid-container { margin-top: 8px; }

  .grid-cell.flash-tap {
    background: var(--accent, #4fc3f7) !important;
    color: #000 !important;
  }
</style>
</head>
<body>

<h2 style="margin:0">Touch Test</h2>

<div id="controls">
  <label for="inp-cols">Cols</label>
  <input id="inp-cols" type="number" min="1" max="20" value="5">
  <label for="inp-rows">Rows</label>
  <input id="inp-rows" type="number" min="1" max="20" value="5">
  <button id="apply-btn">Apply</button>
</div>

<div id="info">loading settings…</div>
<div id="grid-container"></div>

<script src="grid.js"></script>
<script src="touch-input.js"></script>
<script src="blob-ws.js"></script>
<script>
  const gridContainer = document.getElementById('grid-container');
  const inpCols       = document.getElementById('inp-cols');
  const inpRows       = document.getElementById('inp-rows');
  const applyBtn      = document.getElementById('apply-btn');
  const infoEl        = document.getElementById('info');

  // Defaults — overwritten by /api/captcha-settings if available
  let screenRect  = { x0: -150, x1: 150, z0: 50, z1: 200 };
  let dwellFrames = 3;

  let grid       = null;
  let touchInput = null;

  function buildGrid() {
    const cols = Math.max(1, parseInt(inpCols.value, 10) || 5);
    const rows = Math.max(1, parseInt(inpRows.value, 10) || 5);
    inpCols.value = cols;
    inpRows.value = rows;

    if (grid) {
      grid.resize(cols, rows);
    } else {
      grid = new Grid(gridContainer, cols, rows, (col, row) => {
        // pointer/mouse tap — same path as camera tap
        onTap(col, row);
      });
    }

    if (touchInput) {
      touchInput.resize(cols, rows);
    } else {
      touchInput = new TouchInput({
        cols, rows, screenRect, dwellFrames,
        onTap,
      });
    }
  }

  function onTap(col, row) {
    grid?.flash(col, row, 'flash-tap', 400);
  }

  applyBtn.addEventListener('click', buildGrid);
  // Also rebuild on Enter inside either input
  [inpCols, inpRows].forEach(el => {
    el.addEventListener('keydown', e => { if (e.key === 'Enter') buildGrid(); });
  });

  // Load settings then build initial grid
  (async () => {
    try {
      const res = await fetch('/api/captcha-settings');
      const s   = await res.json();
      if (s.screen_rect)        screenRect  = s.screen_rect;
      if (s.blob_dwell_frames)  dwellFrames = s.blob_dwell_frames;
      const { x0, x1, z0, z1 } = screenRect;
      infoEl.textContent =
        `screen_rect  x: ${x0} → ${x1} cm   z: ${z0} → ${z1} cm  |  dwell: ${dwellFrames} frames`;
    } catch (_) {
      infoEl.textContent = 'settings unavailable — using defaults';
    }
    buildGrid();
  })();

  // Connect WebSocket and feed blobs to TouchInput
  new BlobWS({
    url: BlobWS.wsUrl(),
    onBlobs: blobs => touchInput?.update(blobs),
  });
</script>
</body>
</html>
