<div class="detail-body">
  <iframe id="frame" class="content-frame" src=""></iframe>
  <div class="log-section">
    <div class="log-header">
      <span>Logs</span>
      <span class="log-conn" id="log-conn">connecting…</span>
    </div>
    <div class="log-panel" id="log-panel">
      <div id="log-lines"></div>

<script src="network.js"></script>
<script src="log-panel.js"></script>
<script>
const HOST = window.location.hostname || 'localhost';
let PORT;   // from network.json; set below before anything connects

elementPort('flowerbeds').then(port => {
  PORT = port;
  document.getElementById('frame').src = `http://${HOST}:${PORT}/`;
  connectLogs(HOST, PORT);
}).catch(e => console.error(e));
</script>
