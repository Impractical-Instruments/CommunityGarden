<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flower Beds — Detail</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body class="detail-page">
<nav class="nav">
  <a href="index.html">← Dashboard</a>
  <h1>Flower Beds</h1>
  <button id="cal-btn" onclick="startLayoutCalibrate()"
          style="margin-left:auto;background:#2a4a7f;color:#eee;border:1px solid #4a7abf;
                 border-radius:4px;padding:.3em .9em;cursor:pointer;font-family:monospace;font-size:.85em;">
    Layout Calibrate
  </button>
  <span id="cal-msg" style="font-size:.8em;color:#aaa;margin-left:.5em;"></span>
</nav>
<div class="detail-body">
  <iframe id="frame" class="content-frame" src=""></iframe>
  <div class="log-section">
    <div class="log-header">
      <span>Logs</span>
      <span class="log-conn" id="log-conn">connecting…</span>
    </div>
    <div class="log-panel" id="log-panel">
      <div id="log-lines"></div>
    </div>
  </div>
</div>
<script>
const HOST = window.location.hostname || 'localhost';
const PORT = 8765;

document.getElementById('frame').src = `http://${HOST}:${PORT}/`;

const logPanel = document.getElementById('log-panel');
const logLines = document.getElementById('log-lines');
const logConn  = document.getElementById('log-conn');

function appendLog(entry) {
  const div = document.createElement('div');
  div.className = 'log-line log-' + entry.level.toLowerCase();
  div.textContent = `[${entry.ts}] ${entry.level.padEnd(8)} ${entry.msg}`;
  logLines.appendChild(div);
  if (logPanel.scrollTop + logPanel.clientHeight >= logPanel.scrollHeight - 40)
    logPanel.scrollTop = logPanel.scrollHeight;
  while (logLines.children.length > 500)
    logLines.removeChild(logLines.firstChild);
}

function connectLogs() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${HOST}:${PORT}/logs`);
  ws.onopen  = () => { logConn.textContent = 'connected';     logConn.className = 'log-conn connected'; };
  ws.onclose = () => { logConn.textContent = 'reconnecting…'; logConn.className = 'log-conn disconnected'; setTimeout(connectLogs, 2000); };
  ws.onerror = () => ws.close();
  ws.onmessage = ev => { try { appendLog(JSON.parse(ev.data)); } catch (_) {} };
}

connectLogs();

const calBtn = document.getElementById('cal-btn');
const calMsg = document.getElementById('cal-msg');

function startLayoutCalibrate() {
  calBtn.disabled = true;
  calMsg.textContent = 'starting…';
  fetch(`http://${HOST}:${PORT}/layout-calibrate/start`, { method: 'POST' })
    .then(r => r.json())
    .then(d => {
      calMsg.textContent = d.ok ? 'capturing frames…' : ('error: ' + (d.error || '?'));
      if (!d.ok) calBtn.disabled = false;
    })
    .catch(() => { calMsg.textContent = 'request failed'; calBtn.disabled = false; });
}
</script>
</body>
</html>
