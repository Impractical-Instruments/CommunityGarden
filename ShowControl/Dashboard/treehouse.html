<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tree House — Detail</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body class="detail-page">
<nav class="nav">
  <a href="index.html">← Dashboard</a>
  <h1>Tree House</h1>
</nav>
<div class="detail-body">

  <!-- Status panel -->
  <div class="th-status">
    <div class="th-row">
      <div class="th-field">
        <label>Mode</label>
        <span id="th-mode">—</span>
      </div>
      <div class="th-field">
        <label>Brightness</label>
        <span id="th-brightness">—</span>
      </div>
      <div class="th-field">
        <label>State</label>
        <span class="log-conn" id="ws-conn">connecting…</span>
      </div>
    </div>
    <div class="th-displays" id="th-displays">
      <span style="color:#444;font-size:.75em">waiting for data…</span>
    </div>
  </div>

  <!-- Controls panel -->
  <div class="ctrl-section">
    <div class="ctrl-header"><span>Controls</span></div>
    <div class="ctrl-rows">

      <div class="ctrl-row">
        <span class="ctrl-label">Show</span>
        <div class="ctrl-btns">
          <button class="ctrl-btn" data-show-mode="full"     onclick="ctrlBtn(this)">full</button>
          <button class="ctrl-btn" data-show-mode="dim"      onclick="ctrlBtn(this)">dim</button>
          <button class="ctrl-btn" data-show-mode="off"      onclick="ctrlBtn(this)">off</button>
        </div>
      </div>

      <!-- LED pattern rows — injected from first WebSocket state -->
      <div id="led-ctrl-rows"></div>

      <div class="ctrl-row">
        <span class="ctrl-label">Looking Glass</span>
        <div class="ctrl-btns">
          <button class="ctrl-btn" data-scene="bloom"    onclick="ctrlBtn(this)">bloom</button>
          <button class="ctrl-btn" data-scene="fractal"  onclick="ctrlBtn(this)">fractal</button>
          <button class="ctrl-btn" data-scene="mycelium" onclick="ctrlBtn(this)">mycelium</button>
          <button class="ctrl-btn" data-scene="cosmos"   onclick="ctrlBtn(this)">cosmos</button>
        </div>
      </div>

      <div class="ctrl-row">
        <span class="ctrl-label">Forge &amp; Flora</span>
        <div class="ctrl-btns">
          <button class="ctrl-btn" data-forge-mode="welding"   onclick="ctrlBtn(this)">welding</button>
          <button class="ctrl-btn" data-forge-mode="gardening" onclick="ctrlBtn(this)">gardening</button>
        </div>
      </div>

      <div class="ctrl-row">
        <span class="ctrl-label">Porch Lights</span>
        <div class="ctrl-btns">
          <button class="ctrl-btn trigger" data-action="porch-blowup" onclick="ctrlBtn(this)">blowup</button>
          <button class="ctrl-btn"         data-action="porch-reset"  onclick="ctrlBtn(this)">reset</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Log section fills remaining space -->
  <div class="log-section log-section-fill">
    <div class="log-header">
      <span>Logs</span>
      <span class="log-conn" id="log-conn">connecting…</span>
    </div>
    <div class="log-panel" id="log-panel">
      <div id="log-lines"></div>
    </div>
  </div>

</div>
<script>
const HOST = window.location.hostname || 'localhost';
const PORT = 8766;
const LED_PATTERNS = ['solid', 'breathe', 'strobe', 'chase', 'incandescent', 'mycelium'];

// ── Control helpers ──────────────────────────────────────────────────────────

async function ctrlPost(url, body = {}) {
  try {
    await fetch(`http://${HOST}:${PORT}${url}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
  } catch (e) {
    console.error('Control POST failed:', url, e);
  }
}

function ctrlBtn(btn) {
  const d = btn.dataset;
  if      (d.showMode)       ctrlPost('/control/show/mode',    {mode: d.showMode});
  else if (d.displayPattern) ctrlPost('/control/led-pattern',  {display: d.displayPattern, pattern: d.pattern});
  else if (d.scene)          ctrlPost('/control/looking-glass', {scene: d.scene});
  else if (d.forgeMode)      ctrlPost('/control/forge-mode',   {mode: d.forgeMode});
  else if (d.action === 'porch-blowup') ctrlPost('/control/porch-blowup');
  else if (d.action === 'porch-reset')  ctrlPost('/control/porch-reset');
}

// ── LED control rows — built once from first state message ───────────────────

let ledControlsBuilt = false;
function buildLEDControls(displays) {
  if (ledControlsBuilt) return;
  const container = document.getElementById('led-ctrl-rows');
  displays.forEach(d => {
    if (!('pattern' in (d.params || {}))) return;
    const row = document.createElement('div');
    row.className = 'ctrl-row';
    const lbl = document.createElement('span');
    lbl.className = 'ctrl-label';
    lbl.textContent = d.name;
    const btns = document.createElement('div');
    btns.className = 'ctrl-btns';
    LED_PATTERNS.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'ctrl-btn';
      btn.dataset.displayPattern = d.name;
      btn.dataset.pattern = p;
      btn.textContent = p;
      btn.onclick = () => ctrlBtn(btn);
      btns.appendChild(btn);
    });
    row.appendChild(lbl);
    row.appendChild(btns);
    container.appendChild(row);
  });
  ledControlsBuilt = true;
}

// ── Active state highlighting ────────────────────────────────────────────────

function updateActiveStates(s) {
  // Show mode
  document.querySelectorAll('[data-show-mode]').forEach(btn =>
    btn.classList.toggle('active', btn.dataset.showMode === s.mode));

  const dm = {};
  (s.displays || []).forEach(d => { dm[d.name] = d; });

  // LED patterns
  document.querySelectorAll('[data-display-pattern][data-pattern]').forEach(btn => {
    const d = dm[btn.dataset.displayPattern];
    btn.classList.toggle('active', d?.params?.pattern === btn.dataset.pattern);
  });

  // Looking Glass scenes
  const lg = dm['Looking Glass'];
  document.querySelectorAll('[data-scene]').forEach(btn =>
    btn.classList.toggle('active', lg?.params?.scene === btn.dataset.scene));

  // Forge & Flora — highlight only at exact endpoints
  const ff = dm['Forge & Flora'];
  document.querySelectorAll('[data-forge-mode]').forEach(btn => {
    const tb = ff?.params?.target_blend;
    btn.classList.toggle('active',
      (btn.dataset.forgeMode === 'welding'   && tb === 0) ||
      (btn.dataset.forgeMode === 'gardening' && tb === 1));
  });
}

// ── State WebSocket ──────────────────────────────────────────────────────────

const wsConn = document.getElementById('ws-conn');

function connectState() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${HOST}:${PORT}/ws`);

  ws.onopen  = () => { wsConn.textContent = 'connected'; wsConn.className = 'log-conn connected'; };
  ws.onclose = () => { wsConn.textContent = 'reconnecting…'; wsConn.className = 'log-conn disconnected'; setTimeout(connectState, 2000); };
  ws.onerror = () => ws.close();

  ws.onmessage = ev => {
    try {
      const s = JSON.parse(ev.data);

      document.getElementById('th-mode').textContent = s.mode || '—';
      document.getElementById('th-brightness').textContent =
        s.brightness != null ? Math.round(s.brightness * 100) + '%' : '—';

      const container = document.getElementById('th-displays');
      container.innerHTML = '';
      (s.displays || []).forEach(d => {
        const el = document.createElement('div');
        el.className = 'th-display' + (d.enabled ? '' : ' disabled');
        const dot = document.createElement('span');
        dot.className = 'dot ' + (d.enabled ? 'online' : 'offline');
        el.appendChild(dot);
        el.appendChild(document.createTextNode(d.name));
        container.appendChild(el);
      });

      buildLEDControls(s.displays || []);
      updateActiveStates(s);
    } catch (_) {}
  };
}

connectState();

// ── Log WebSocket ────────────────────────────────────────────────────────────

const logPanel = document.getElementById('log-panel');
const logLines = document.getElementById('log-lines');
const logConn  = document.getElementById('log-conn');

function appendLog(entry) {
  const div = document.createElement('div');
  div.className = 'log-line log-' + entry.level.toLowerCase();
  div.textContent = `[${entry.ts}] ${entry.level.padEnd(8)} ${entry.msg}`;
  logLines.appendChild(div);
  if (logPanel.scrollTop + logPanel.clientHeight >= logPanel.scrollHeight - 40)
    logPanel.scrollTop = logPanel.scrollHeight;
  while (logLines.children.length > 500)
    logLines.removeChild(logLines.firstChild);
}

function connectLogs() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${HOST}:${PORT}/logs`);
  ws.onopen  = () => { logConn.textContent = 'connected';     logConn.className = 'log-conn connected'; };
  ws.onclose = () => { logConn.textContent = 'reconnecting…'; logConn.className = 'log-conn disconnected'; setTimeout(connectLogs, 2000); };
  ws.onerror = () => ws.close();
  ws.onmessage = ev => { try { appendLog(JSON.parse(ev.data)); } catch (_) {} };
}

connectLogs();
</script>
</body>
</html>
