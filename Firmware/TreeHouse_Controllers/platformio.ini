; TreeHouse location controllers — one ESP32-S3 per location (ADR-0020).
;
; Pick an environment in the PlatformIO switcher (or `pio run -e jess -t upload`)
; to build for that location.  All four share the code in src/ and lib/; only
; src/targets/<name>.h differs.
;
; Before the first build:
;   1. cp include/secrets.h.example include/secrets.h   and fill in the WiFi credentials
;   2. python3 ../../scripts/hooks/firmware_config_gen.py   to refresh include/net_config.h

[platformio]
default_envs = swannatopia

; ---------------------------------------------------------------------------
; Shared ESP32-S3 settings.  Not [env] — that would also apply to env:native.
; ---------------------------------------------------------------------------
[esp32s3]
platform = espressif32@~6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
; The S3's built-in USB JTAG: debugging needs no extra probe, just the cable
; already plugged in for flashing.
debug_tool = esp-builtin
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
lib_ldf_mode = deep+
lib_deps =
    makuna/NeoPixelBus@^2.8.0

[env:swannatopia]
extends = esp32s3
build_flags = ${esp32s3.build_flags} -D CG_TARGET_SWANNATOPIA

[env:julia]
extends = esp32s3
build_flags = ${esp32s3.build_flags} -D CG_TARGET_JULIA

[env:jess]
extends = esp32s3
build_flags = ${esp32s3.build_flags} -D CG_TARGET_JESS

[env:dormer]
extends = esp32s3
build_flags = ${esp32s3.build_flags} -D CG_TARGET_DORMER

; ---------------------------------------------------------------------------
; Host tests: `pio test -e native`.  Only lib/ is compiled — everything in src/
; touches Arduino hardware and is deliberately left out.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_ldf_mode = deep+
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
