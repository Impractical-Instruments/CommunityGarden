; Signs of life — the minimum needed to prove an ESP32-S3 board is alive.
;
; The DevKitC-1 has TWO USB sockets, and which one you use changes where
; Serial output goes. If you see nothing, try the other environment before
; you suspect the board:
;
;   env:uart  -> output on the "UART" socket (via the CH340/CP210x bridge)
;   env:usb   -> output on the "USB" socket (the S3's native USB)
;
;   pio run -e uart -t upload && pio device monitor -b 115200
;   pio run -e usb  -t upload && pio device monitor -b 115200

[platformio]
default_envs = uart

[common]
platform = espressif32@~6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps = adafruit/Adafruit NeoPixel@^1.12.3

[env:uart]
extends = common
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=0

[env:usb]
extends = common
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1
