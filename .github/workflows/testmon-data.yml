name: Testmon data

# Record which Python code each FundingCAPTCHA test executes, for the
# fundingcaptcha job in tests.yml to select from. Runs on main because PR runs
# can only read caches saved on the default branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testmon-data
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    # A full run takes about 7 minutes; stop a hung one rather than hold the runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Python and every package from uv.lock, in .venv, on PATH for later steps.
      # --locked fails the job if uv.lock is out of date with pyproject.toml.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.19'
          activate-environment: true
          enable-cache: true

      - name: Install Python and test deps
        run: uv sync --locked

      # testmon drops its data when the patch version changes, so the cache key names it.
      - name: Python version
        id: py
        run: echo "python-version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"

      - name: Install headless OpenGL (shader player GL tests)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri libgl1

      # No data is restored first: every test runs and is recorded from scratch.
      - name: Run every FundingCAPTCHA test and record its dependencies
        env:
          TESTMON_DATAFILE: .testmondata
        run: python3 -m pytest ShowControl/FundingCAPTCHA --testmon -v --durations=25

      # Keep this key in step with tests.yml. Saved only when every test passed.
      - name: Save testmon data
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .testmondata
          key: testmon-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
