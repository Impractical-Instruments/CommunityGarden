name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Which test jobs does this PR need? See .github/scripts/ci-changes.sh.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      gl: ${{ steps.filter.outputs.gl }}
      firmware: ${{ steps.filter.outputs.firmware }}
      reuben: ${{ steps.filter.outputs.reuben }}
      force: ${{ steps.filter.outputs.force }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need base-branch history to diff the PR against below

      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # --no-renames: a file moved out of a tested directory must count as a change there.
          git diff --name-only --no-renames "$BASE_SHA"...HEAD > /tmp/changed
          echo "Changed paths:"; sed 's/^/  /' /tmp/changed
          .github/scripts/ci-changes.sh < /tmp/changed | tee -a "$GITHUB_OUTPUT"

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need base-branch history to diff the PR against below

      - name: Guard against private show content
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          PRIVATE_PATH="ShowControl/FundingCAPTCHA/images/private"
          LEVELS_FILE="ShowControl/FundingCAPTCHA/bodycaptcha-levels.json"

          echo "Diffing against base $BASE_SHA..."
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"

          fail=0

          if echo "$changed" | grep -E "^${PRIVATE_PATH}(/|\$)" > /tmp/private_paths; then
              echo "::error::This PR touches $PRIVATE_PATH, which must never be committed to this public repo:"
              sed 's/^/::error::  /' /tmp/private_paths
              echo "::error::Remove these paths from the PR (git rm --cached, or drop the commit) and re-push."
              fail=1
          fi

          if echo "$changed" | grep -qx "$LEVELS_FILE"; then
              level_diff="$(git diff -U0 "$BASE_SHA"...HEAD -- "$LEVELS_FILE")"
              if echo "$level_diff" | grep -E '^\+.*"image".*"private/' > /tmp/private_refs; then
                  echo "::error::$LEVELS_FILE gains a reference to a private image in this PR:"
                  sed 's/^/::error::  /' /tmp/private_refs
                  echo "::error::This is the public, tracked levels file — a \"private/...\" image reference"
                  echo "::error::only resolves on a machine with the private content cloned, and merging it"
                  echo "::error::puts that path into permanent public history. Re-point the level at a public"
                  echo "::error::image (or author it under images/private/<show-name>/levels.json instead,"
                  echo "::error::opening the editor with --levels so saves land there, not here) and re-push."
                  fail=1
              fi
          fi

          if [ "$fail" -ne 0 ]; then
              exit 1
          fi

          echo "No private-content leaks detected."

  # Everything except FundingCAPTCHA: seconds.
  fast:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # the encoder-bridge test reads reuben's default ports

      # Python and every package from uv.lock, in .venv, on PATH for later steps.
      # --locked fails the job if uv.lock is out of date with pyproject.toml.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.19'
          activate-environment: true
          enable-cache: true

      - name: Install Python and test deps
        run: uv sync --locked

      - name: Run tests
        run: make test-fast

  # FundingCAPTCHA, including the shader tests on software OpenGL: minutes.
  # The job starts on the path filter above; inside it, pytest-testmon runs only
  # the tests whose Python dependencies changed since the data testmon-data.yml
  # recorded on main. A path on .github/scripts/shader-force-run.txt, or no data,
  # runs every test. See .github/scripts/run-shader-tests.sh.
  fundingcaptcha:
    needs: changes
    if: needs.changes.outputs.gl == 'true'
    runs-on: ubuntu-latest
    # A full run takes about 7 minutes. pytest ends a hung test itself after 120 s
    # (faulthandler_timeout in pyproject.toml); this stops anything that gets past that.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Python and every package from uv.lock, in .venv, on PATH for later steps.
      # --locked fails the job if uv.lock is out of date with pyproject.toml.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.19'
          activate-environment: true
          enable-cache: true

      - name: Install Python and test deps
        run: uv sync --locked

      # testmon drops its data when the patch version changes, so the cache key names it.
      - name: Python version
        id: py
        run: echo "python-version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"

      - name: Install headless OpenGL (shader player GL tests)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri libgl1

      # Keep this key in step with testmon-data.yml. Only caches saved on main are
      # visible here; a new Python or dependency set finds none and runs everything.
      - name: Restore testmon data from main
        id: testmon
        if: needs.changes.outputs.force == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .testmondata
          key: testmon-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: testmon-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('uv.lock') }}-

      - name: Run tests
        env:
          FORCE_PATH: ${{ needs.changes.outputs.force }}
          CACHE_KEY: ${{ steps.testmon.outputs.cache-matched-key }}
          TESTMON_DATAFILE: .testmondata
        run: .github/scripts/run-shader-tests.sh

  # TreeHouse controller firmware: host tests, then a build of each kind of
  # environment so a change to platformio.ini or src/ cannot break one unseen.
  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # make runs PlatformIO through uvx, at the version the Makefile pins.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.19'

      # The ESP32 toolchain and libraries: a few hundred MB, fixed by platformio.ini.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('Firmware/TreeHouse_Controllers/platformio.ini') }}

      - name: Run host tests
        run: make test-firmware

      - name: Build the firmware
        run: make build-firmware

  # Every PR: vendor/reuben must point at a commit already on reuben's dev branch.
  # While iterating it can point anywhere; this gates merging only (#236).
  reuben-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: vendor/reuben is on reuben dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/check-reuben-pin.sh

  # reuben, the Playing the Pipes audio engine: build the CLI from the submodule,
  # then load-check every instrument. A missing sample fails it too.
  reuben:
    needs: changes
    if: needs.changes.outputs.reuben == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      # The instruments' samples are Git LFS files; validate decodes them. Only these, not
      # every LFS file in the repo.
      - name: Fetch the Playing the Pipes samples
        run: git lfs pull --include "ShowControl/PlayingThePipes/Lamplight2026/media/*"

      # cpal (reuben's audio I/O) links ALSA on Linux.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Submodule commit
        id: pin
        run: echo "sha=$(git rev-parse HEAD:vendor/reuben)" >> "$GITHUB_OUTPUT"

      # The toolchain rust-toolchain.toml pins, the crates, and the build. The
      # newest cache for any earlier pin is a warm start for a new one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            vendor/reuben/target
          key: reuben-${{ runner.os }}-${{ steps.pin.outputs.sha }}
          restore-keys: reuben-${{ runner.os }}-

      - name: Build reuben
        run: make reuben

      - name: Validate instruments
        run: make validate-instruments

  # The one check to require in branch protection. It keeps the name the single
  # job had before the split. A skipped job passes; a failed or cancelled one does not.
  test:
    needs: [changes, guard, fast, fundingcaptcha, firmware, reuben-pin, reuben]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes guard fast fundingcaptcha firmware reuben-pin reuben: $RESULTS"
          for r in $RESULTS; do
              case "$r" in
                  success|skipped) ;;
                  *) echo "::error::a needed job ended with: $r"; exit 1 ;;
              esac
          done
